# ═══════════════════════════════════════════════════════════════════════════════
# LocalDistill Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
# Services:
#   - monitor:  Dashboard for monitoring pipeline runs (port 8080)
#   - trainer:  GPU-enabled training container
#   - api:      REST API for data access (port 8000)
#   - proxy:    API proxy for capture mode (port 8787) [optional]
#
# Usage:
#   # Start monitor dashboard only
#   docker compose up monitor
#
#   # Run training pipeline (demo mode - fast)
#   docker compose run --rm trainer python distill.py run --mode demo
#
#   # Run training pipeline (full mode)
#   docker compose run --rm trainer python distill.py run --mode full
#
#   # Start everything including proxy (capture mode)
#   docker compose --profile capture up
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── Monitor Dashboard ─────────────────────────────────────────────────────────
  # Web UI for monitoring pipeline runs, viewing logs, and tracking adapters
  monitor:
    build: ./monitor
    container_name: localdistill-monitor
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/data/logs:ro
      - ./adapters:/data/adapters:ro
    environment:
      - MONITOR_PORT=8080
      - LOCALDISTILL_LOGS_DIR=/data/logs
      - LOCALDISTILL_ADAPTERS_DIR=/data/adapters
      - MONITOR_REFRESH_INTERVAL=5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Trainer (GPU) ─────────────────────────────────────────────────────────────
  # Main training container with Unsloth, runs the distillation pipeline
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: localdistill-trainer
    volumes:
      # Data and outputs
      - ./data:/data
      - ./logs:/app/logs
      - ./adapters:/app/adapters
      # Config and source
      - ./config.yaml:/app/config.yaml:ro
      - ./curated_train.jsonl:/app/curated_train.jsonl:ro
      # HuggingFace cache (persist downloads)
      - ./.cache/huggingface:/root/.cache/huggingface
    environment:
      - LOCALDISTILL_DB_PATH=/data/localdistill.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Default command: show help
    command: ["python", "distill.py", "--help"]

  # ── API Server ────────────────────────────────────────────────────────────────
  # REST API for accessing training data and exporting datasets
  api:
    build: ./api
    container_name: localdistill-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./proxy/db.py:/app/db.py:ro
      - ./proxy/quality.py:/app/quality.py:ro
      - ./trainer/dataset_exporter.py:/app/dataset_exporter.py:ro
    environment:
      - LOCALDISTILL_DB_PATH=/data/localdistill.db
    restart: unless-stopped
    profiles:
      - api
      - full

  # ── Proxy Server (Capture Mode) ───────────────────────────────────────────────
  # API proxy that captures conversations for training data
  proxy:
    build: ./proxy
    container_name: localdistill-proxy
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./proxy/db.py:/app/db.py:ro
      - ./proxy/quality.py:/app/quality.py:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LOCALDISTILL_DB_PATH=/data/localdistill.db
    restart: unless-stopped
    profiles:
      - capture
      - full

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  # Bind mount for data directory (SQLite DB, etc.)
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
