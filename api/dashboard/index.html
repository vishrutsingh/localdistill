<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localdistill</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
  body { background: #0a0a0b; color: #e4e4e7; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 0.75rem; }
  .badge-good { background: #065f46; color: #6ee7b7; }
  .badge-bad { background: #7f1d1d; color: #fca5a5; }
  .badge-neutral { background: #1e293b; color: #94a3b8; }
  .btn { padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-good { background: #16a34a; color: white; }
  .btn-bad { background: #dc2626; color: white; }
  .btn-neutral { background: #334155; color: #cbd5e1; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; justify-content: center; align-items: center; }
  .modal.open { display: flex; }
  .modal-content { background: #18181b; border: 1px solid #27272a; border-radius: 0.75rem; padding: 1.5rem; max-width: 640px; width: 90%; max-height: 80vh; overflow-y: auto; }
</style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto">
<h1 class="text-2xl font-bold mb-6 text-emerald-400">localdistill</h1>

<!-- Stats row -->
<div id="stats-row" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

<!-- Charts row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
  <div class="card p-4"><h3 class="text-sm font-semibold text-zinc-400 mb-3">Score Distribution</h3><canvas id="scoreChart" height="200"></canvas></div>
  <div class="card p-4"><h3 class="text-sm font-semibold text-zinc-400 mb-3">Conversations / Day</h3><canvas id="convChart" height="200"></canvas></div>
</div>

<!-- Conversations table -->
<div class="card p-4 mb-8">
  <div class="flex justify-between items-center mb-3">
    <h3 class="text-sm font-semibold text-zinc-400">Conversations</h3>
    <div id="page-controls" class="flex gap-2"></div>
  </div>
  <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-zinc-500 text-left"><tr><th class="p-2">ID</th><th class="p-2">Title</th><th class="p-2">Turns</th><th class="p-2">Score</th><th class="p-2">Status</th><th class="p-2">Rate</th></tr></thead><tbody id="conv-table"></tbody></table></div>
</div>

<!-- Training -->
<div id="training-panel" class="card p-4"></div>

<!-- Detail modal -->
<div id="detail-modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modal-body"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let convPage = 1;
let scoreChart, convChart;

async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function rate(id, rating) {
  await fetch(`/api/conversations/${id}/rate?rating=${rating}`, {method:'POST'});
  loadAll();
}

async function showDetail(id) {
  const [conv, signals] = await Promise.all([
    api(`/api/conversations/${id}`),
    api(`/api/conversations/${id}/signals`)
  ]);
  const c = conv.conversation;
  const s = signals.signals;
  let html = `<h2 class="text-lg font-bold mb-2">${c.title || 'Untitled'}</h2>
    <p class="text-zinc-500 text-sm mb-4">Score: <span class="font-mono font-bold ${c.quality_score >= 0.7 ? 'text-emerald-400' : c.quality_score <= 0.25 ? 'text-red-400' : 'text-amber-400'}">${(c.quality_score||0).toFixed(2)}</span> &middot; ${c.turn_count} turns &middot; ${c.created_at}</p>
    <h3 class="text-sm font-semibold text-zinc-400 mb-2">Signals (${s.length})</h3>`;
  if (s.length) {
    html += '<div class="space-y-1 mb-4">';
    for (const sig of s) {
      const color = ['hallucination','correction','code_error','frustration'].includes(sig.signal_type) ? 'text-red-400' :
        ['misunderstanding','vagueness','regeneration'].includes(sig.signal_type) ? 'text-amber-400' : 'text-emerald-400';
      html += `<div class="text-xs"><span class="${color} font-mono">${sig.signal_type}</span> <span class="text-zinc-500">— "${sig.matched_text}"</span></div>`;
    }
    html += '</div>';
  } else {
    html += '<p class="text-zinc-600 text-sm mb-4">No quality signals detected.</p>';
  }
  html += '<h3 class="text-sm font-semibold text-zinc-400 mb-2">Turns</h3>';
  for (const t of conv.turns) {
    const roleColor = t.role === 'user' ? 'text-blue-400' : t.role === 'assistant' ? 'text-emerald-400' : 'text-zinc-500';
    html += `<div class="mb-2"><span class="text-xs ${roleColor} font-mono uppercase">${t.role}</span><pre class="text-xs text-zinc-300 mt-1 whitespace-pre-wrap">${(t.content||'').slice(0,300)}</pre></div>`;
  }
  html += '<div class="flex gap-2 mt-4">' +
    `<button class="btn btn-good" onclick="rate('${id}','good');closeModal()">Good</button>` +
    `<button class="btn btn-bad" onclick="rate('${id}','bad');closeModal()">Bad</button>` +
    `<button class="btn btn-neutral" onclick="rate('${id}','neutral');closeModal()">Neutral</button>` +
    `<button class="btn btn-neutral" onclick="closeModal()">Close</button></div>`;
  $('#modal-body').innerHTML = html;
  $('#detail-modal').classList.add('open');
}

function closeModal() { $('#detail-modal').classList.remove('open'); }

async function loadAll() {
  const [status, stats, training, convs] = await Promise.all([
    api('/api/status'), api('/api/stats'), api('/api/training'),
    api(`/api/conversations?page=${convPage}&per_page=20`)
  ]);

  // Stats row
  $('#stats-row').innerHTML = `
    <div class="card p-4"><div class="text-2xl font-bold text-emerald-400">${status.total_conversations}</div><div class="text-xs text-zinc-500">Conversations</div></div>
    <div class="card p-4"><div class="text-2xl font-bold text-emerald-400">${status.curated_count}</div><div class="text-xs text-zinc-500">Curated</div></div>
    <div class="card p-4"><div class="text-2xl font-bold text-amber-400">${status.training_runs}</div><div class="text-xs text-zinc-500">Training Runs</div></div>
    <div class="card p-4"><div class="text-2xl font-bold ${status.proxy==='healthy'?'text-emerald-400':'text-red-400'}">${status.proxy}</div><div class="text-xs text-zinc-500">Proxy</div></div>`;

  // Score distribution chart
  const dist = stats.score_distribution;
  if (scoreChart) scoreChart.destroy();
  scoreChart = new Chart($('#scoreChart'), {
    type: 'bar',
    data: { labels: dist.map(d=>d.bucket), datasets: [{ data: dist.map(d=>d.cnt), backgroundColor: ['#dc2626','#f59e0b','#eab308','#22c55e','#16a34a'] }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#71717a' }, grid: { color: '#27272a' } }, x: { ticks: { color: '#71717a' }, grid: { display: false } } } }
  });

  // Conversations per day chart  
  const perDay = stats.conversations_per_day;
  if (convChart) convChart.destroy();
  convChart = new Chart($('#convChart'), {
    type: 'line',
    data: { labels: perDay.map(d=>d.day), datasets: [{ data: perDay.map(d=>d.cnt), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', fill: true, tension: 0.3 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#71717a', stepSize: 1 }, grid: { color: '#27272a' } }, x: { ticks: { color: '#71717a' }, grid: { display: false } } } }
  });

  // Conversations table
  $('#conv-table').innerHTML = convs.items.map(c => {
    const scoreClass = c.quality_score >= 0.7 ? 'text-emerald-400' : c.quality_score <= 0.25 ? 'text-red-400' : 'text-amber-400';
    return `<tr class="border-t border-zinc-800 hover:bg-zinc-900 cursor-pointer" onclick="showDetail('${c.id}')">
      <td class="p-2 text-zinc-600 font-mono text-xs">${c.id.slice(0,8)}</td>
      <td class="p-2 text-zinc-300">${(c.title||'untitled').slice(0,50)}</td>
      <td class="p-2 text-zinc-500">${c.turn_count}</td>
      <td class="p-2 font-mono font-bold ${scoreClass}">${(c.quality_score||0).toFixed(2)}</td>
      <td class="p-2"><span class="text-xs px-2 py-0.5 rounded ${c.status==='completed'?'badge-good':'badge-neutral'}">${c.status}</span></td>
      <td class="p-2" onclick="event.stopPropagation()">
        <button class="btn btn-good mr-1" onclick="rate('${c.id}','good')">Good</button>
        <button class="btn btn-bad mr-1" onclick="rate('${c.id}','bad')">Bad</button>
        <button class="btn btn-neutral" onclick="rate('${c.id}','neutral')">x</button>
      </td></tr>`;
  }).join('');

  // Page controls
  $('#page-controls').innerHTML = `
    <button class="btn btn-neutral" onclick="convPage=Math.max(1,convPage-1);loadAll()" ${convPage===1?'disabled':''}>Prev</button>
    <span class="text-xs text-zinc-500 self-center">${convs.page} / ${Math.ceil(convs.total/convs.per_page) || 1}</span>
    <button class="btn btn-neutral" onclick="convPage++;loadAll()" ${convs.page * convs.per_page >= convs.total?'disabled':''}>Next</button>`;

  // Training panel
  const tr = training;
  const lastRun = tr.runs[0];
  $('#training-panel').innerHTML = `
    <h3 class="text-sm font-semibold text-zinc-400 mb-3">Training</h3>
    <p class="text-sm">Pending curated: <span class="text-emerald-400 font-bold">${tr.pending_curated}</span></p>
    ${lastRun ? `<div class="mt-2 text-xs text-zinc-500">
      Last run: ${lastRun.created_at} &middot; ${lastRun.base_model} &middot; ${lastRun.num_examples} examples &middot; 
      <span class="${lastRun.status==='completed'?'text-emerald-400':lastRun.status==='failed'?'text-red-400':'text-amber-400'}">${lastRun.status}</span>
      ${lastRun.eval_score_after ? ` &middot; Eval: ${lastRun.eval_score_before} → <span class="text-emerald-400">${lastRun.eval_score_after}</span>` : ''}
    </div>` : '<p class="text-zinc-600 text-xs mt-1">No training runs yet. Run <code class="text-zinc-500">./train.sh</code> or docker compose --profile training up.</p>'}
    ${tr.runs.length > 1 ? `<div class="mt-3 space-y-1">${tr.runs.slice(1).map(r => `<div class="text-xs text-zinc-600">${r.created_at} &middot; ${r.status} &middot; ${r.num_examples} ex</div>`).join('')}</div>` : ''}`;
}

loadAll();
setInterval(loadAll, 30000); // Refresh every 30s
</script>
</body>
</html>
