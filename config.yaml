# ═══════════════════════════════════════════════════════════════════════════════
# LocalDistill Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# One method selector: training.method = sft | reopd | dpo | orpo | kto
#   sft:   curate → [generate] → train → evaluate → benchmark → deploy
#   reopd: curate → collect → weight → train → evaluate → benchmark → deploy
#   dpo / orpo / kto: curate → train → evaluate → benchmark → deploy
#          (preference methods; require dataset.source: preference)
#
# Artifacts are content-addressed under data/ and adapters/ — rerunning the
# same command resumes automatically. Use --force to redo.
#
# Quick start:
#   ./distill run --method sft --mode demo          # fast test (10 examples, 1 epoch)
#   ./distill run --method sft --mode preference    # SFT on UltraFeedback, 5k/3ep
#   ./distill run --method reopd --mode preference  # ReOPD from base model
#   ./distill run --method reopd --from-adapter latest  # ReOPD on top of last SFT
#
# ═══════════════════════════════════════════════════════════════════════════════

run_mode: demo

# ── Models ────────────────────────────────────────────────────────────────────
models:
  student: unsloth/Llama-3.2-3B-Instruct
  teacher: openrouter/deepseek/deepseek-chat
  # Concurrent teacher API calls for collect/generate (conversations run in
  # parallel, turns within a conversation stay sequential). Lower if you hit
  # rate limits, raise if your plan allows.
  teacher_concurrency: 8

# ── Data Source ───────────────────────────────────────────────────────────────
dataset:
  source: file                # file | huggingface | preference
  path: ./curated_train.jsonl
  format: chatml
  holdout_ratio: 0.1          # preference only: fraction reserved for evaluation

  huggingface:
    dataset_id: RyokoAI/ShareGPT52K
    split: train
    config: null

# ── Curation Filters ──────────────────────────────────────────────────────────
curation:
  max_examples: null
  min_quality_score: 0.0
  filters:
    min_turns: 2
    max_turns: 50
    min_chars: 100
    max_chars: 50000
    exclude_code_heavy: false

# ── Training ──────────────────────────────────────────────────────────────────
training:
  method: sft                 # sft | reopd | dpo | orpo | kto

  # SFT only: generate fresh teacher completions on the curated prompts and
  # train on those instead of the dataset's own responses. Use this with
  # public datasets (UltraFeedback etc.) so training matches YOUR teacher.
  generate_teacher: false

  lora:
    rank: 16
    alpha: 32
    dropout: 0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  hyperparams:
    learning_rate: 2.0e-4
    epochs: 3
    batch_size: 2
    gradient_accumulation_steps: 4
    max_seq_length: 2048
    warmup_steps: 5
    weight_decay: 0.01
    lr_scheduler: linear      # linear | cosine | constant | cosine_with_restarts
    seed: 42

  quantization: 4bit          # 4bit | 8bit | none

  # HF-native checkpoints in the keyed adapter dir — interrupted training
  # resumes automatically on the next run with the same config.
  checkpoint:
    enabled: true
    steps: 100
    keep_last: 2

  # Early stopping on eval loss (carves a small eval split off the train set)
  early_stopping:
    enabled: false
    patience: 3               # evals without improvement
    min_delta: 0.001
    eval_fraction: 0.02

  # Evaluation judge (evaluate stage, preference datasets only)
  # Keep this in a different model family from models.teacher: LLM judges
  # prefer their own family's outputs, so judging with the teacher inflates the
  # win rate exactly when distillation worked. Every pair is judged in both
  # orders (2 calls/example) so position bias is measured, not assumed away.
  judge:
    mode: llm                 # heuristic (smoke test only, cannot gate) | llm | human
    llm_model: openrouter/openai/gpt-4o-mini
    max_examples: 50
    win_rate_target: 0.60

# ── ReOPD (training.method: reopd) ────────────────────────────────────────────
reopd:
  kappa: 0.9                  # per-turn decay: turn t gets weight kappa^t
  epochs: 3
  lr_scale: 0.5               # reopd LR = base LR * lr_scale
  max_teacher_tokens: 512     # per-turn teacher completion budget

# ── Preference methods (training.method: dpo | orpo | kto) ───────────────────
preference:
  beta: 0.1                   # DPO/KTO beta; ORPO odds-ratio weight
  lr_scale: 1.0               # method LR = base LR * lr_scale
  epochs: 1
  max_prompt_length: 1024
  # DPO on small GPUs: precompute reference log probs in one pass instead of
  # keeping a second (reference) model resident in VRAM
  precompute_ref_log_probs: true

# ── Benchmarking ──────────────────────────────────────────────────────────────
benchmark:
  enabled: true
  tasks:
    - gsm8k
  limit: 50
  device: auto

# ── Deployment ────────────────────────────────────────────────────────────────
deploy:
  gguf:
    enabled: true
    quantization: q4_k_m
  ollama:
    enabled: false
    model_name: localdistill

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO
  dir: ./logs
  max_run_logs: 20
  console:
    enabled: true
    colors: true
    progress_bars: true
  metrics:
    log_every_n_steps: 1
    include_loss: true
    include_lr: true
    include_grad_norm: false

# ── Monitor Dashboard ─────────────────────────────────────────────────────────
monitor:
  enabled: true
  port: 8080
  refresh_interval: 5

# ── Presets (selected with --mode; deep-merged over the base config) ─────────
presets:
  demo:
    dataset:
      source: preference
      huggingface:
        dataset_id: HuggingFaceH4/ultrafeedback_binarized
        split: train_prefs
      holdout_ratio: 0.1
    curation:
      max_examples: 10
    training:
      hyperparams:
        epochs: 1
      checkpoint:
        enabled: false
    benchmark:
      enabled: false

  full:
    dataset:
      source: preference
      huggingface:
        dataset_id: HuggingFaceH4/ultrafeedback_binarized
        split: train_prefs
      holdout_ratio: 0.1
    curation:
      max_examples: 5000
    training:
      generate_teacher: true
      hyperparams:
        epochs: 3
    benchmark:
      limit: 100

  preference:
    dataset:
      source: preference
      huggingface:
        dataset_id: HuggingFaceH4/ultrafeedback_binarized
        split: train_prefs
      holdout_ratio: 0.1
    curation:
      max_examples: 5000
    training:
      generate_teacher: true
      hyperparams:
        epochs: 3
      checkpoint:
        enabled: true
        steps: 10
    benchmark:
      enabled: false

  # Multi-turn conversations — the right input for reopd (decay needs turns).
  # Parquet mirror of ShareGPT (RyokoAI/ShareGPT52K raw JSON fails on datasets 4.x).
  # Sized for a first run: ~200 conversations x ~4 turns of teacher calls.
  multiturn:
    dataset:
      source: huggingface
      huggingface:
        dataset_id: Aeala/ShareGPT_Vicuna_unfiltered
        split: train
    curation:
      max_examples: 200
    training:
      generate_teacher: true 
      hyperparams:
        epochs: 1
    benchmark:
      enabled: false
