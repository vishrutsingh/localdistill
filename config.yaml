# ═══════════════════════════════════════════════════════════════════════════════
# LocalDistill Configuration — V2
# ═══════════════════════════════════════════════════════════════════════════════
#
# Training strategy, checkpointing, early stopping, judge selection,
# and dataset mixing are now fully configurable.
#
# Quick start:
#   ./distill run --mode demo           # 50 examples, 1 epoch (fast test)
#   ./distill run --mode preference     # SFT on UltraFeedback, 5k/3ep
#   ./distill run --mode preference --on-policy  # Two-phase ReOPD
#
# ═══════════════════════════════════════════════════════════════════════════════

run_mode: demo

# ── Models ────────────────────────────────────────────────────────────────────
models:
  student: unsloth/Llama-3.2-3B-Instruct
  teacher: openrouter/deepseek/deepseek-chat

# ── Data Source ───────────────────────────────────────────────────────────────
dataset:
  source: file
  path: ./curated_train.jsonl
  format: chatml
  holdout_ratio: 0.1

  huggingface:
    dataset_id: RyokoAI/ShareGPT52K
    split: train
    config: null

  # For preference datasets (evaluated: HuggingFaceH4/ultrafeedback_binarized)
  preference:
    dataset_id: HuggingFaceH4/ultrafeedback_binarized
    split: train_prefs

# ── Curation Filters ──────────────────────────────────────────────────────────
curation:
  max_examples: null
  min_quality_score: 0.0
  filters:
    min_turns: 2
    max_turns: 50
    min_chars: 100
    max_chars: 50000
    exclude_code_heavy: false

# ── Training Configuration ────────────────────────────────────────────────────
training:
  # Training strategy: sft | dpo | on_policy | spin
  #   sft:  Standard supervised fine-tuning on chosen responses (simple, fast)
  #   dpo:  Direct preference optimization (uses rejected pairs too) — not yet implemented
  #   on_policy: ReOPD — collect teacher trajectories, replay with decay weighting
  #   spin: Synthetic preference injection — future
  strategy:
    name: sft
    # Dataset source: auto | curated | teacher_pool | on_policy_weighted
    #   auto: Let the pipeline decide based on strategy name
    #   curated: Always use train.jsonl (chosen responses)
    #   teacher_pool: Use teacher_pool.jsonl (teacher-generated responses)
    #   on_policy_weighted: Use on_policy_weighted.jsonl (decay-weighted)
    dataset_source: auto

  # Mix multiple dataset sources (ratios sum to ~1.0)
  dataset_mix:
    curated: 1.0
    teacher_pool: 0.0
    on_policy_weighted: 0.0

  # LoRA configuration
  lora:
    rank: 16
    alpha: 32
    dropout: 0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  # Training hyperparameters
  hyperparams:
    learning_rate: 2.0e-4
    epochs: 3
    batch_size: 2
    gradient_accumulation_steps: 4
    max_seq_length: 2048
    warmup_steps: 5
    weight_decay: 0.01
    lr_scheduler: linear    # linear | cosine | constant | cosine_with_restarts
    seed: 42

  quantization: 4bit        # 4bit | 8bit | none

  # Checkpointing: save adapter every N steps, keep last N, always save final
  checkpoint:
    enabled: true           # Set false to run faster (no disk I/O during training)
    steps: 10               # Save every N steps
    keep_last: 2            # Keep only last N checkpoints
    save_final: true        # Always save final adapter on completion/interruption

  # Early stopping: halt training if loss stops improving
  early_stopping:
    enabled: false
    patience: 50            # Steps without improvement
    min_delta: 0.001        # Count as "improved" only if loss drops by this much
    monitor: loss           # Metric to watch
    mode: min               # "min" for loss, "max" for accuracy

# ── Evaluation / Judge ────────────────────────────────────────────────────────
judge:
  mode: heuristic           # heuristic | llm | human
  llm_model: openrouter/deepseek/deepseek-chat
  max_examples: 50          # How many holdout pairs to evaluate
  win_rate_target: 0.60     # Success gate: student wins/ties >60%

# ── On-Policy Distillation (ReOPD) ────────────────────────────────────────────
on_policy:
  enabled: false
  teacher_query_interval: 10
  decay_function: exponential
  exponential_lambda: 0.9

# ── Benchmarking ──────────────────────────────────────────────────────────────
benchmark:
  enabled: true
  tasks:
    - gsm8k
  limit: 50
  compare_base: true
  device: auto

# ── Deployment ────────────────────────────────────────────────────────────────
deploy:
  gguf:
    enabled: true
    quantization: q4_k_m
  ollama:
    enabled: false
    model_name: localdistill
    auto_register: true

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO
  dir: ./logs
  max_run_logs: 20
  console:
    enabled: true
    colors: true
    progress_bars: true
  metrics:
    log_every_n_steps: 1
    include_loss: true
    include_lr: true
    include_grad_norm: false

# ── Monitor Dashboard ─────────────────────────────────────────────────────────
monitor:
  enabled: true
  port: 8080
  refresh_interval: 5

# ── Presets (override settings per run_mode) ──────────────────────────────────
presets:
  demo:
    curation:
      max_examples: 50
    training:
      hyperparams:
        epochs: 1
    benchmark:
      limit: 10
    on_policy:
      enabled: false

  full:
    curation:
      max_examples: 5000
    training:
      hyperparams:
        epochs: 3
    benchmark:
      limit: 100
    on_policy:
      enabled: false

  preference:
    dataset:
      source: preference
      huggingface:
        dataset_id: HuggingFaceH4/ultrafeedback_binarized
        split: train_prefs
      holdout_ratio: 0.1
    curation:
      max_examples: 5000
    training:
      hyperparams:
        epochs: 3
      checkpoint:
        enabled: true
        steps: 10
        save_final: true
    benchmark:
      enabled: false
    on_policy:
      enabled: false
